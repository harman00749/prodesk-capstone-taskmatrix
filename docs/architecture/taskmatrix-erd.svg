<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">TaskMatrix MongoDB entity relationship diagram</title>
  <desc id="desc">MongoDB collections for users, sessions, workspaces, memberships, projects, boards, columns, tasks, comments, activities, and notifications with their primary relationships.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1F2937" flood-opacity=".08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7C73B5"/></marker>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .box { fill:#FFFFFF; stroke:#D7D3EA; stroke-width:1.3; filter:url(#shadow); }
      .bar { fill:#302A55; }
      .bar2 { fill:#6558D9; }
      .name { fill:#FFFFFF; font-size:17px; font-weight:700; }
      .field { fill:#344054; font-size:12px; }
      .type { fill:#8883A8; font-size:11px; }
      .key { fill:#6558D9; font-size:10px; font-weight:700; }
      .edge { fill:none; stroke:#7C73B5; stroke-width:1.7; marker-end:url(#arrow); }
      .edge2 { fill:none; stroke:#2E9C87; stroke-width:1.7; marker-end:url(#arrow); }
      .relation { fill:#4E477A; font-size:11px; font-weight:600; paint-order:stroke; stroke:#F7F7FB; stroke-width:4px; }
    </style>
  </defs>
  <rect width="1600" height="1200" fill="#F7F7FB"/>
  <g class="font">
    <text x="60" y="58" fill="#17132D" font-size="30" font-weight="700">TaskMatrix — MongoDB Entity Relationship Diagram</text>
    <text x="60" y="88" fill="#667085" font-size="14">Tenant boundary: workspaceId · Independent lifecycles use references · Bounded task metadata is embedded</text>

    <!-- Relationship paths drawn behind collections -->
    <path class="edge" d="M300 224H400"/><text class="relation" x="335" y="214">1 : N</text>
    <path class="edge" d="M180 338v99h240"/><text class="relation" x="194" y="395">user 1 : N sessions</text>
    <path class="edge" d="M300 270h40v520h100"/><text class="relation" x="314" y="772">recipient</text>
    <path class="edge" d="M660 212H770"/><text class="relation" x="702" y="201">workspace 1 : N</text>
    <path class="edge" d="M900 338v82H635"/><text class="relation" x="720" y="410">workspace 1 : N projects</text>
    <path class="edge" d="M895 338v462h-90"/><text class="relation" x="820" y="785">workspace 1 : N activities</text>
    <path class="edge" d="M1040 214h80"/><text class="relation" x="1060" y="202">1 : N</text>
    <path class="edge2" d="M1190 338v82H1110"/><text class="relation" x="1124" y="409">project 1 : 1..N board</text>
    <path class="edge2" d="M1220 338v500h-130"/><text class="relation" x="1110" y="827">project feed</text>
    <path class="edge2" d="M1110 548h80v34h-70"/><text class="relation" x="1130" y="568">board 1 : N</text>
    <path class="edge2" d="M1110 706h100v170h-100"/><text class="relation" x="1130" y="862">column 1 : N</text>
    <path class="edge2" d="M580 920v84h210"/><text class="relation" x="652" y="992">task 1 : N comments</text>
    <path class="edge" d="M805 952h90v-60"/><text class="relation" x="820" y="941">task activities</text>
    <path class="edge" d="M300 290h85v-78h15"/><text class="relation" x="318" y="201">member</text>
    <path class="edge" d="M580 790V562h-180"/><text class="relation" x="590" y="675">project 1 : N tasks</text>

    <!-- Users -->
    <g transform="translate(60 128)"><rect class="box" width="240" height="210" rx="14"/><path class="bar" d="M14 0h212a14 14 0 0114 14v38H0V14A14 14 0 0114 0z"/><text class="name" x="18" y="33">users</text><g transform="translate(16 72)"><text class="key">PK</text><text class="field" x="28">_id</text><text class="type" x="148">ObjectId</text><text class="field" y="27">email</text><text class="type" x="148" y="27">string · unique</text><text class="field" y="54">name</text><text class="type" x="148" y="54">string</text><text class="field" y="81">passwordHash</text><text class="type" x="148" y="81">string</text><text class="field" y="108">avatarUrl</text><text class="type" x="148" y="108">string?</text><text class="field" y="135">createdAt</text><text class="type" x="148" y="135">date</text></g></g>

    <!-- Memberships -->
    <g transform="translate(400 128)"><rect class="box" width="260" height="210" rx="14"/><path class="bar2" d="M14 0h232a14 14 0 0114 14v38H0V14A14 14 0 0114 0z"/><text class="name" x="18" y="33">memberships</text><g transform="translate(16 72)"><text class="key">PK</text><text class="field" x="28">_id</text><text class="type" x="166">ObjectId</text><text class="key" y="27">FK</text><text class="field" x="28" y="27">workspaceId</text><text class="type" x="166" y="27">→ workspaces</text><text class="key" y="54">FK</text><text class="field" x="28" y="54">userId</text><text class="type" x="166" y="54">→ users</text><text class="field" y="81">role</text><text class="type" x="166" y="81">enum</text><text class="field" y="108">status</text><text class="type" x="166" y="108">enum</text><text class="field" y="135">joinedAt</text><text class="type" x="166" y="135">date</text></g></g>

    <!-- Workspaces -->
    <g transform="translate(770 128)"><rect class="box" width="270" height="210" rx="14"/><path class="bar" d="M14 0h242a14 14 0 0114 14v38H0V14A14 14 0 0114 0z"/><text class="name" x="18" y="33">workspaces</text><g transform="translate(16 72)"><text class="key">PK</text><text class="field" x="28">_id</text><text class="type" x="176">ObjectId</text><text class="field" y="27">name</text><text class="type" x="176" y="27">string</text><text class="field" y="54">slug</text><text class="type" x="176" y="54">string · unique</text><text class="key" y="81">FK</text><text class="field" x="28" y="81">ownerId</text><text class="type" x="176" y="81">→ users</text><text class="field" y="108">settings</text><text class="type" x="176" y="108">embedded object</text><text class="field" y="135">createdAt</text><text class="type" x="176" y="135">date</text></g></g>

    <!-- Projects -->
    <g transform="translate(1120 128)"><rect class="box" width="300" height="210" rx="14"/><path class="bar2" d="M14 0h272a14 14 0 0114 14v38H0V14A14 14 0 0114 0z"/><text class="name" x="18" y="33">projects</text><g transform="translate(16 72)"><text class="key">PK</text><text class="field" x="28">_id</text><text class="type" x="196">ObjectId</text><text class="key" y="27">FK</text><text class="field" x="28" y="27">workspaceId</text><text class="type" x="196" y="27">→ workspaces</text><text class="field" y="54">name / key</text><text class="type" x="196" y="54">string</text><text class="key" y="81">FK</text><text class="field" x="28" y="81">leadId</text><text class="type" x="196" y="81">→ users</text><text class="field" y="108">status</text><text class="type" x="196" y="108">enum</text><text class="field" y="135">archivedAt</text><text class="type" x="196" y="135">date?</text></g></g>

    <!-- Sessions -->
    <g transform="translate(60 438)"><rect class="box" width="270" height="200" rx="14"/><path class="bar" d="M14 0h242a14 14 0 0114 14v38H0V14A14 14 0 0114 0z"/><text class="name" x="18" y="33">sessions</text><g transform="translate(16 72)"><text class="key">PK</text><text class="field" x="28">_id</text><text class="type" x="170">ObjectId</text><text class="key" y="27">FK</text><text class="field" x="28" y="27">userId</text><text class="type" x="170" y="27">→ users</text><text class="field" y="54">refreshTokenHash</text><text class="type" x="170" y="54">string</text><text class="field" y="81">expiresAt</text><text class="type" x="170" y="81">date · TTL</text><text class="field" y="108">revokedAt</text><text class="type" x="170" y="108">date?</text></g></g>

    <!-- Boards -->
    <g transform="translate(840 438)"><rect class="box" width="270" height="170" rx="14"/><path class="bar" d="M14 0h242a14 14 0 0114 14v38H0V14A14 14 0 0114 0z"/><text class="name" x="18" y="33">boards</text><g transform="translate(16 72)"><text class="key">PK</text><text class="field" x="28">_id</text><text class="type" x="170">ObjectId</text><text class="key" y="27">FK</text><text class="field" x="28" y="27">workspaceId</text><text class="type" x="170" y="27">→ workspaces</text><text class="key" y="54">FK</text><text class="field" x="28" y="54">projectId</text><text class="type" x="170" y="54">→ projects</text><text class="field" y="81">name</text><text class="type" x="170" y="81">string</text></g></g>

    <!-- Columns -->
    <g transform="translate(840 626)"><rect class="box" width="270" height="180" rx="14"/><path class="bar2" d="M14 0h242a14 14 0 0114 14v38H0V14A14 14 0 0114 0z"/><text class="name" x="18" y="33">columns</text><g transform="translate(16 72)"><text class="key">PK</text><text class="field" x="28">_id</text><text class="type" x="170">ObjectId</text><text class="key" y="27">FK</text><text class="field" x="28" y="27">workspaceId</text><text class="type" x="170" y="27">→ workspaces</text><text class="key" y="54">FK</text><text class="field" x="28" y="54">boardId</text><text class="type" x="170" y="54">→ boards</text><text class="field" y="81">name / position</text><text class="type" x="170" y="81">string / number</text><text class="field" y="108">wipLimit</text><text class="type" x="170" y="108">number?</text></g></g>

    <!-- Notifications -->
    <g transform="translate(440 438)"><rect class="box" width="310" height="210" rx="14"/><path class="bar" d="M14 0h282a14 14 0 0114 14v38H0V14A14 14 0 0114 0z"/><text class="name" x="18" y="33">notifications</text><g transform="translate(16 72)"><text class="key">PK</text><text class="field" x="28">_id</text><text class="type" x="206">ObjectId</text><text class="key" y="27">FK</text><text class="field" x="28" y="27">userId / workspaceId</text><text class="type" x="206" y="27">references</text><text class="field" y="54">type / entity</text><text class="type" x="206" y="54">enum / ref</text><text class="field" y="81">deduplicationKey</text><text class="type" x="206" y="81">string · unique</text><text class="field" y="108">readAt</text><text class="type" x="206" y="108">date?</text><text class="field" y="135">createdAt</text><text class="type" x="206" y="135">date</text></g></g>

    <!-- Tasks -->
    <g transform="translate(300 790)"><rect class="box" width="280" height="280" rx="14"/><path class="bar2" d="M14 0h252a14 14 0 0114 14v38H0V14A14 14 0 0114 0z"/><text class="name" x="18" y="33">tasks</text><g transform="translate(16 72)"><text class="key">PK</text><text class="field" x="28">_id</text><text class="type" x="176">ObjectId</text><text class="key" y="27">FK</text><text class="field" x="28" y="27">workspaceId / projectId</text><text class="type" x="176" y="27">references</text><text class="key" y="54">FK</text><text class="field" x="28" y="54">columnId</text><text class="type" x="176" y="54">→ columns</text><text class="field" y="81">key / title / description</text><text class="type" x="176" y="81">strings</text><text class="field" y="108">position / version</text><text class="type" x="176" y="108">numbers</text><text class="field" y="135">priority / dueDate</text><text class="type" x="176" y="135">enum / date?</text><text class="key" y="162">FK</text><text class="field" x="28" y="162">creatorId / assigneeIds</text><text class="type" x="176" y="162">→ users</text><text class="field" y="189">labels / attachments</text><text class="type" x="176" y="189">embedded arrays</text><text class="field" y="216">archivedAt / createdAt</text><text class="type" x="176" y="216">dates</text></g></g>

    <!-- Comments -->
    <g transform="translate(790 884)"><rect class="box" width="300" height="200" rx="14"/><path class="bar" d="M14 0h272a14 14 0 0114 14v38H0V14A14 14 0 0114 0z"/><text class="name" x="18" y="33">comments</text><g transform="translate(16 72)"><text class="key">PK</text><text class="field" x="28">_id</text><text class="type" x="196">ObjectId</text><text class="key" y="27">FK</text><text class="field" x="28" y="27">workspaceId / taskId</text><text class="type" x="196" y="27">references</text><text class="key" y="54">FK</text><text class="field" x="28" y="54">authorId</text><text class="type" x="196" y="54">→ users</text><text class="field" y="81">body / mentions</text><text class="type" x="196" y="81">string / refs</text><text class="field" y="108">editedAt / createdAt</text><text class="type" x="196" y="108">dates</text></g></g>

    <!-- Activities -->
    <g transform="translate(1120 790)"><rect class="box" width="330" height="230" rx="14"/><path class="bar2" d="M14 0h302a14 14 0 0114 14v38H0V14A14 14 0 0114 0z"/><text class="name" x="18" y="33">activities (append-only)</text><g transform="translate(16 72)"><text class="key">PK</text><text class="field" x="28">_id</text><text class="type" x="216">ObjectId</text><text class="key" y="27">FK</text><text class="field" x="28" y="27">workspaceId / projectId</text><text class="type" x="216" y="27">references</text><text class="key" y="54">FK</text><text class="field" x="28" y="54">actorId</text><text class="type" x="216" y="54">→ users</text><text class="field" y="81">action</text><text class="type" x="216" y="81">enum</text><text class="field" y="108">entityType / entityId</text><text class="type" x="216" y="108">polymorphic ref</text><text class="field" y="135">metadata</text><text class="type" x="216" y="135">embedded object</text><text class="field" y="162">createdAt</text><text class="type" x="216" y="162">date</text></g></g>

    <g transform="translate(60 1128)"><rect width="1480" height="40" rx="10" fill="#EEEAFE"/><text x="18" y="25" fill="#4D3FB4" font-size="12" font-weight="600">Key constraints: unique membership(workspaceId, userId) · unique project(workspaceId, key) · ordered task(projectId, columnId, position) · TTL session(expiresAt)</text></g>
  </g>
</svg>
