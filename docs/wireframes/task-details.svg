<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">TaskMatrix task details screen</title>
  <desc id="desc">High-fidelity desktop task view with description, checklist, comments, editable metadata, and activity history.</desc>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1F2937" flood-opacity=".07"/></filter>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .muted { fill:#667085; }
      .label { fill:#667085; font-size:12px; font-weight:600; }
      .body { fill:#344054; font-size:13px; }
      .heading { fill:#17132D; font-weight:700; }
    </style>
  </defs>
  <rect width="1440" height="960" fill="#F7F7FB"/>
  <g class="font">
    <rect width="232" height="960" fill="#17132D"/>
    <g transform="translate(24 24)"><rect width="36" height="36" rx="10" fill="#7767E8"/><path d="M9 11h18M9 18h12M9 25h15" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="48" y="26" fill="#FFFFFF" font-size="20" font-weight="700">TaskMatrix</text></g>
    <g transform="translate(16 92)"><text x="10" y="0" fill="#827C9E" font-size="11" font-weight="700" letter-spacing="1.4">WORKSPACE</text><rect y="18" width="200" height="52" rx="12" fill="#2A2447"/><rect x="12" y="30" width="28" height="28" rx="8" fill="#55D6BE"/><text x="26" y="49" fill="#17132D" font-size="12" font-weight="800" text-anchor="middle">N</text><text x="52" y="48" fill="#FFFFFF" font-size="14" font-weight="600">Nova Labs</text></g>
    <g transform="translate(16 184)"><rect width="200" height="42" rx="10" fill="#3A3266"/><text x="16" y="27" fill="#B9B1FF" font-size="16">▦</text><text x="44" y="27" fill="#FFFFFF" font-size="14" font-weight="600">Projects</text><g transform="translate(0 54)"><circle cx="22" cy="20" r="8" fill="#8B7CFF"/><text x="44" y="25" fill="#FFFFFF" font-size="14" font-weight="600">Atlas Web App</text><rect x="10" y="44" width="190" height="37" rx="9" fill="#282241"/><text x="44" y="68" fill="#BDB7D3" font-size="13">Board</text><rect x="10" y="85" width="190" height="37" rx="9" fill="#282241"/><text x="44" y="109" fill="#BDB7D3" font-size="13">Activity</text></g></g>
    <g transform="translate(16 812)"><line x1="8" y1="0" x2="192" y2="0" stroke="#312B4A"/><circle cx="28" cy="40" r="18" fill="#E7E3FF"/><text x="28" y="44" fill="#4D3FB4" font-size="10" font-weight="700" text-anchor="middle">PK</text><text x="56" y="37" fill="#FFFFFF" font-size="13" font-weight="600">Parvinder Kaur</text><text x="56" y="55" fill="#8F89A6" font-size="11">Workspace Admin</text></g>

    <g transform="translate(232 0)"><rect width="1208" height="72" fill="#FFFFFF"/><line y1="71.5" x2="1208" y2="71.5" stroke="#EAECF0"/><text x="28" y="44" fill="#667085" font-size="13">Nova Labs / Atlas Web App / Board / ATLAS-136</text><g transform="translate(1034 17)"><rect width="38" height="38" rx="10" fill="#F2F3F7"/><text x="19" y="25" fill="#667085" font-size="18" text-anchor="middle">⌕</text><rect x="50" width="124" height="38" rx="10" fill="#6558D9"/><text x="112" y="24" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">+ Create task</text></g></g>

    <g transform="translate(264 104)">
      <g><rect width="112" height="36" rx="9" fill="#FFFFFF" stroke="#D0D5DD"/><text x="18" y="23" fill="#344054" font-size="13">← Back to board</text><rect x="958" width="36" height="36" rx="9" fill="#FFFFFF" stroke="#D0D5DD"/><text x="976" y="23" fill="#667085" font-size="14" text-anchor="middle">☆</text><rect x="1004" width="36" height="36" rx="9" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1022" y="22" fill="#667085" font-size="16" text-anchor="middle">•••</text><rect x="1050" width="64" height="36" rx="9" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1082" y="23" fill="#C83D54" font-size="12" font-weight="600" text-anchor="middle">Archive</text></g>

      <g transform="translate(0 60)">
        <rect width="742" height="774" rx="18" fill="#FFFFFF" filter="url(#soft)"/>
        <g transform="translate(34 32)">
          <g><rect width="92" height="28" rx="14" fill="#EEEAFE"/><circle cx="16" cy="14" r="5" fill="#6558D9"/><text x="30" y="19" fill="#4D3FB4" font-size="11" font-weight="700">IN PROGRESS</text><text x="672" y="19" class="muted" font-size="12" text-anchor="end">ATLAS-136</text></g>
          <text x="0" y="82" class="heading" font-size="28">Persist drag-and-drop task ordering</text>
          <text x="0" y="112" class="muted" font-size="13">Created by Aisha Khan on 14 Aug 2026 · Updated 18 minutes ago</text>
          <line x1="0" y1="140" x2="674" y2="140" stroke="#EAECF0"/>

          <text x="0" y="178" class="heading" font-size="16">Description</text>
          <text x="0" y="210" class="body"><tspan x="0" dy="0">Store task order when a card moves within or between board columns. The API must validate</tspan><tspan x="0" dy="22">membership, persist the destination and position atomically, and publish a versioned event only</tspan><tspan x="0" dy="22">after the database commit succeeds.</tspan></text>
          <rect x="0" y="276" width="674" height="66" rx="10" fill="#F7F7FB"/>
          <text x="16" y="300" fill="#4D3FB4" font-size="12" font-weight="700">Acceptance note</text><text x="16" y="324" class="body">Keyboard users must have an explicit move control in addition to drag-and-drop.</text>

          <g transform="translate(0 378)">
            <text class="heading" font-size="16">Checklist</text><text x="674" y="0" class="muted" font-size="12" text-anchor="end">3 of 5 complete</text>
            <rect x="0" y="18" width="674" height="7" rx="3.5" fill="#ECEAF7"/><rect x="0" y="18" width="404" height="7" rx="3.5" fill="#6558D9"/>
            <g transform="translate(0 48)"><rect width="18" height="18" rx="5" fill="#6558D9"/><path d="M5 9l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.8"/><text x="32" y="14" class="body">Define move request and response contract</text></g>
            <g transform="translate(0 80)"><rect width="18" height="18" rx="5" fill="#6558D9"/><path d="M5 9l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.8"/><text x="32" y="14" class="body">Add project membership and role checks</text></g>
            <g transform="translate(0 112)"><rect width="18" height="18" rx="5" fill="#6558D9"/><path d="M5 9l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.8"/><text x="32" y="14" class="body">Persist numeric position with version increment</text></g>
            <g transform="translate(0 144)"><rect width="18" height="18" rx="5" fill="#FFFFFF" stroke="#98A2B3"/><text x="32" y="14" class="body">Rebalance dense positions transactionally</text></g>
            <g transform="translate(0 176)"><rect width="18" height="18" rx="5" fill="#FFFFFF" stroke="#98A2B3"/><text x="32" y="14" class="body">Cover concurrent move conflicts with integration tests</text></g>
          </g>

          <line x1="0" y1="586" x2="674" y2="586" stroke="#EAECF0"/>
          <g transform="translate(0 622)"><text class="heading" font-size="16">Comments</text><text x="80" y="0" class="muted" font-size="12">3</text><circle cx="18" cy="44" r="18" fill="#E7E3FF"/><text x="18" y="48" fill="#4D3FB4" font-size="10" font-weight="700" text-anchor="middle">PK</text><rect x="50" y="20" width="624" height="60" rx="12" fill="#FFFFFF" stroke="#D0D5DD"/><text x="66" y="55" fill="#98A2B3" font-size="13">Add a comment or mention a teammate…</text><rect x="586" y="34" width="72" height="34" rx="9" fill="#6558D9"/><text x="622" y="55" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Comment</text></g>
        </g>
      </g>

      <g transform="translate(762 60)">
        <rect width="352" height="476" rx="18" fill="#FFFFFF" filter="url(#soft)"/>
        <g transform="translate(24 28)"><text class="heading" font-size="16">Task details</text>
          <g transform="translate(0 44)"><text class="label" y="12">Status</text><rect x="110" width="194" height="36" rx="9" fill="#F7F7FB"/><circle cx="126" cy="18" r="5" fill="#6558D9"/><text x="140" y="23" fill="#344054" font-size="12" font-weight="600">In progress</text><path d="M282 15l5 5 5-5" fill="none" stroke="#667085"/></g>
          <g transform="translate(0 96)"><text class="label" y="12">Assignees</text><circle cx="128" cy="18" r="16" fill="#DDEBFF"/><text x="128" y="22" fill="#2256A3" font-size="9" font-weight="700" text-anchor="middle">AK</text><text x="152" y="23" class="body" font-weight="600">Aisha Khan</text><circle cx="286" cy="18" r="14" fill="#F2F3F7"/><text x="286" y="22" class="muted" font-size="14" text-anchor="middle">+</text></g>
          <g transform="translate(0 148)"><text class="label" y="12">Priority</text><rect x="110" width="76" height="28" rx="14" fill="#FFE4E8"/><path d="M124 20V8m0 0h13l-3 4 3 4h-13" fill="none" stroke="#B4233C" stroke-width="1.5"/><text x="148" y="19" fill="#B4233C" font-size="11" font-weight="700">HIGH</text></g>
          <g transform="translate(0 196)"><text class="label" y="12">Due date</text><text x="110" y="15" fill="#C83D54" font-size="13" font-weight="600">16 Aug 2026 · Today</text></g>
          <g transform="translate(0 238)"><text class="label" y="12">Sprint</text><text x="110" y="15" class="body" font-weight="600">Sprint 8</text></g>
          <g transform="translate(0 280)"><text class="label" y="12">Estimate</text><text x="110" y="15" class="body" font-weight="600">5 points</text></g>
          <g transform="translate(0 322)"><text class="label" y="12">Labels</text><rect x="110" width="70" height="26" rx="13" fill="#E8F7F2"/><text x="145" y="18" fill="#13725E" font-size="10" font-weight="700" text-anchor="middle">BACKEND</text><rect x="186" width="74" height="26" rx="13" fill="#EEEAFE"/><text x="223" y="18" fill="#4D3FB4" font-size="10" font-weight="700" text-anchor="middle">KANBAN</text></g>
          <g transform="translate(0 366)"><text class="label" y="12">Reporter</text><circle cx="126" cy="10" r="14" fill="#E7E3FF"/><text x="126" y="14" fill="#4D3FB4" font-size="8" font-weight="700" text-anchor="middle">PK</text><text x="148" y="15" class="body">Parvinder Kaur</text></g>
          <g transform="translate(0 406)"><rect width="304" height="38" rx="9" fill="#FFFFFF" stroke="#D0D5DD"/><text x="152" y="24" fill="#344054" font-size="12" font-weight="600" text-anchor="middle">Edit task details</text></g>
        </g>
      </g>

      <g transform="translate(762 556)">
        <rect width="352" height="278" rx="18" fill="#FFFFFF"/>
        <g transform="translate(24 28)"><text class="heading" font-size="16">Activity</text><text x="304" y="0" fill="#6558D9" font-size="12" font-weight="600" text-anchor="end">View all</text>
          <line x1="16" y1="38" x2="16" y2="226" stroke="#E4E1F3" stroke-width="2"/>
          <g transform="translate(0 42)"><circle cx="16" cy="12" r="11" fill="#E7E3FF"/><text x="16" y="16" fill="#4D3FB4" font-size="7" font-weight="700" text-anchor="middle">PK</text><text x="40" y="9" class="body"><tspan font-weight="600">Parvinder</tspan> moved this task</text><text x="40" y="28" class="muted" font-size="11">To do → In progress · 18m</text></g>
          <g transform="translate(0 98)"><circle cx="16" cy="12" r="11" fill="#DDEBFF"/><text x="16" y="16" fill="#2256A3" font-size="7" font-weight="700" text-anchor="middle">AK</text><text x="40" y="9" class="body"><tspan font-weight="600">Aisha</tspan> completed a checklist item</text><text x="40" y="28" class="muted" font-size="11">Persist numeric position · 1h</text></g>
          <g transform="translate(0 154)"><circle cx="16" cy="12" r="11" fill="#FDE7CE"/><text x="16" y="16" fill="#9A4D00" font-size="7" font-weight="700" text-anchor="middle">RS</text><text x="40" y="9" class="body"><tspan font-weight="600">Rohan</tspan> changed priority</text><text x="40" y="28" class="muted" font-size="11">Medium → High · 3h</text></g>
          <g transform="translate(0 210)"><circle cx="16" cy="10" r="5" fill="#98A2B3"/><text x="40" y="14" class="muted" font-size="11">Task created · 14 Aug</text></g>
        </g>
      </g>
    </g>
  </g>
</svg>
